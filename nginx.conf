server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Behind Traefik/HTTPS: never emit an absolute http:// Location.
    absolute_redirect off;

    # Canonical URLs without trailing slash should serve the page (200),
    # not bounce through http://.../
    location = /profissao {
        try_files /profissao/index.html =404;
    }
    location = /profissao/obrigado {
        try_files /profissao/obrigado/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
